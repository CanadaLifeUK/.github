name: Onboard my repo
description: Request onboarding for a repository
title: "[Onboard]: "
labels: ["gitops-onboard"]
assignees: []
body:
- type: markdown
  attributes:
    value: |
      Thanks for requesting repository onboarding! These values are used by Platform Operator to prepare the tenant GitOps sync.
- type: input
  id: application-name
  attributes:
    label: Application name
    description: Name of the application being onboarded. This becomes the GitOps sync name, deploy path, and workload namespace.
    placeholder: claims-portal-api
  validations:
    required: true
- type: dropdown
  id: deployment-environment
  attributes:
    label: Deployment environment
    description: Which environment should be onboarded first?
    options:
      - dev
      - pre
      - prd
  validations:
    required: true
- type: input
  id: git-branch
  attributes:
    label: Git branch
    description: Branch Platform Operator should reconcile from.
    value: main
  validations:
    required: true
- type: dropdown
  id: repo-type
  attributes:
    label: Repository type
    description: What kind of repository is this?
    options:
      - dotnet
      - javascript
  validations:
    required: true
- type: dropdown
  id: datadog-language
  attributes:
    label: Datadog language
    description: Application runtime language for Datadog instrumentation.
    options:
      - dotnet
      - java
      - js
      - python
      - ruby
      - php
  validations:
    required: true
