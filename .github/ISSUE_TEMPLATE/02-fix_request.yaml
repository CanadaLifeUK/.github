name: Fix Request
description: File a fix request.
title: "[Fix]: "
labels: ["fix"]
assignees: []
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to fill out this fix request!
- type: textarea
  id: what-happened
  attributes:
    label: What happened?
    description: Also tell us, what did you expect to happen?
    placeholder: Tell us what you see!
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Relevant log output
    description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
    render: shell
